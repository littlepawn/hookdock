services:
  hookdock:
    # 镜像由 scripts/build-local.sh 生成（本机 docker VM 内存小，二进制在宿主机交叉编译）
    image: hookdock:0.2.0
    container_name: hookdock
    restart: unless-stopped
    ports:
      - "8380:8080"
    environment:
      HOOKDOCK_ADDR: ":8080"
      HOOKDOCK_DATA: "/data"
      HOOKDOCK_WORKERS: "4"
      # 管理员显示名（登录后界面右上角显示的身份）。默认 admin，部署前请在 .env 里手动改成自己的名字：
      #   HOOKDOCK_ADMIN_NAME=你的名字
      HOOKDOCK_ADMIN_NAME: "${HOOKDOCK_ADMIN_NAME:-admin}"
      # 管理员登录令牌（登录页要填的凭证）必须手动设置，不在 yaml 里给默认值：
      # 在 .env 写 HOOKDOCK_ADMIN_TOKEN=<强随机串>，否则服务以「开放模式」启动（任何人可访问）
      HOOKDOCK_ADMIN_TOKEN: "${HOOKDOCK_ADMIN_TOKEN:-}"
      # 推送消息里的任务详情链接前缀（对外域名），留空则不附链接
      HOOKDOCK_PUBLIC_URL: "${HOOKDOCK_PUBLIC_URL:-}"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
